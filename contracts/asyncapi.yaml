asyncapi: 3.0.0
info:
  title: Pickup Pact Domain Events
  version: 0.5.0

channels:
  commitmentEvents:
    address: pickup.commitment.events.v1
    messages:
      paymentAuthorized:
        payload:
          $ref: "#/components/schemas/CommitmentEvent"
      commitmentConfirmed:
        payload:
          $ref: "#/components/schemas/CommitmentEvent"
      cancellationRequested:
        payload:
          $ref: "#/components/schemas/CommitmentEvent"
      cancellationRejected:
        payload:
          $ref: "#/components/schemas/CommitmentEvent"
      commitmentCancelled:
        payload:
          $ref: "#/components/schemas/CommitmentEvent"
      pickupRescheduled:
        payload:
          $ref: "#/components/schemas/CommitmentEvent"
      pickupPactIssued:
        payload:
          $ref: "#/components/schemas/CommitmentEvent"
      pickupPactRenegotiated:
        payload:
          $ref: "#/components/schemas/CommitmentEvent"
      pickupPactBreached:
        payload:
          $ref: "#/components/schemas/CommitmentEvent"
      pickupClaimed:
        payload:
          $ref: "#/components/schemas/CommitmentEvent"

  fulfillmentEvents:
    address: pickup.fulfillment.events.v1
    messages:
      merchantOrderReceived:
        payload:
          $ref: "#/components/schemas/FulfillmentEvent"
      merchantOrderAccepted:
        payload:
          $ref: "#/components/schemas/FulfillmentEvent"
      preparationStarted:
        payload:
          $ref: "#/components/schemas/FulfillmentEvent"
      orderReady:
        payload:
          $ref: "#/components/schemas/FulfillmentEvent"
      fulfillmentAnomalyDetected:
        payload:
          $ref: "#/components/schemas/FulfillmentEvent"
      merchantPickupCompleted:
        payload:
          $ref: "#/components/schemas/FulfillmentEvent"
      merchantCancellationApproved:
        payload:
          $ref: "#/components/schemas/FulfillmentEvent"
      merchantCancellationRejected:
        payload:
          $ref: "#/components/schemas/FulfillmentEvent"

  financialEvents:
    address: pickup.financial.events.v1
    messages:
      posting:
        payload:
          $ref: "#/components/schemas/LedgerPosting"

  repairCommands:
    address: pickup.repair.commands.v1
    messages:
      repair:
        payload:
          $ref: "#/components/schemas/RepairCommand"

components:
  schemas:
    CommitmentEvent:
      type: object
      required: [event_id, aggregate_id, event_type, occurred_at, schema_version, payload]
      properties:
        event_id: {type: string}
        aggregate_id: {type: string}
        event_type:
          type: string
          enum: [PaymentAuthorized, CommitmentConfirmed, CancellationRequested, CancellationRejected, CommitmentCancelled, PickupRescheduled, PickupPactIssued, PickupPactRenegotiated, PickupPactBreached, PickupClaimed]
        occurred_at: {type: string, format: date-time}
        schema_version: {type: integer, const: 1}
        payload: {type: object}

    FulfillmentEvent:
      type: object
      required: [event_id, aggregate_id, event_type, occurred_at, schema_version, payload]
      properties:
        event_id: {type: string}
        aggregate_id: {type: string}
        event_type:
          type: string
          enum:
            - MerchantOrderReceived
            - MerchantOrderAccepted
            - PreparationStarted
            - OrderReady
            - FulfillmentAnomalyDetected
            - MerchantPickupCompleted
            - MerchantOrderCancelled
            - MerchantPickupScheduleChanged
            - MerchantCancellationApproved
            - MerchantCancellationRejected
        occurred_at: {type: string, format: date-time}
        schema_version: {type: integer, const: 1}
        payload: {type: object}

    LedgerPosting:
      type: object
      required: [eventId, aggregateId, type, amount]
      properties:
        eventId: {type: string}
        aggregateId: {type: string}
        type:
          type: string
          enum: [SETTLEMENT, REVERSE_SETTLEMENT, REWARD, REVERSE_REWARD]
        amount: {type: number, exclusiveMinimum: 0}
        sourceEventId:
          type: [string, "null"]
          description: Required for reversal postings and identifies the original posting

    RepairCommand:
      type: object
      required: [command, aggregate_id, evidence_event_ids]
      properties:
        command:
          type: string
          enum: [NO_OP_DUPLICATE, REBUILD_PROJECTION, REVERSE_SETTLEMENT, REVERSE_REWARD, RESLOT_REVIEW, MANUAL_REVIEW]
        aggregate_id: {type: string}
        evidence_event_ids:
          type: array
          items: {type: string}
