openapi: 3.1.0
info:
  title: Pickup Pact API
  version: 0.4.0
  description: API contracts for pickup commitments, financial postings, and deterministic reconciliation.

paths:
  /api/v1/commitments/quotes:
    post:
      summary: Compute preparation workload on the server and return signed pickup-slot choices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storeId, items]
              properties:
                storeId: {type: string, minLength: 1}
                items:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: {$ref: "#/components/schemas/PickupItem"}
                from: {type: [string, "null"], format: date-time}
                count: {type: integer, minimum: 1, maximum: 12, default: 6}
      responses:
        "200":
          description: Signed quote and feasible pickup slots
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PickupQuote"}
        "400": {description: Invalid or unknown menu item}

  /api/v1/commitments/slots:
    get:
      summary: Diagnostic low-level slot availability query; customer admission uses POST /quotes
      parameters:
        - in: query
          name: storeId
          required: true
          schema: {type: string, minLength: 1}
        - in: query
          name: from
          required: false
          schema: {type: string, format: date-time}
        - in: query
          name: count
          required: false
          schema: {type: integer, minimum: 1, maximum: 12, default: 6}
        - in: query
          name: units
          required: false
          schema: {type: integer, minimum: 1, default: 1}
      responses:
        "200":
          description: Capacity-aware pickup choices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PickupSlotOption"
        "400": {description: Invalid slot query}

  /api/v1/commitments/hold:
    post:
      summary: Lease preparation capacity and create a HELD pickup commitment
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteToken, pickupAt]
              properties:
                quoteToken: {type: string, minLength: 1}
                pickupAt: {type: string, format: date-time}
      responses:
        "200": {description: Held commitment}
        "400": {description: Invalid request}
        "409": {description: Capacity or state conflict}

  /api/v1/commitments/{id}:
    get:
      summary: Read the current pickup commitment state
      parameters:
        - $ref: "#/components/parameters/CommitmentId"
      responses:
        "200": {description: Current commitment}
        "404": {description: Commitment not found}

  /api/v1/commitments/{id}/authorize-payment:
    post:
      summary: Attach a payment-provider authorization result to a held commitment
      parameters:
        - $ref: "#/components/parameters/CommitmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authorizationId]
              properties:
                authorizationId: {type: string, minLength: 1}
      responses:
        "200": {description: Payment authorization attached}
        "404": {description: Commitment not found}
        "409": {description: Invalid commitment state}

  /api/v1/commitments/{id}/confirm:
    post:
      summary: Confirm only after capacity and payment invariants hold
      parameters:
        - $ref: "#/components/parameters/CommitmentId"
      responses:
        "200": {description: Confirmed commitment}
        "404": {description: Commitment not found}
        "409": {description: Missing payment authorization or invalid state}

  /api/v1/commitments/{id}/reschedule:
    post:
      summary: Reserve a new feasible slot and version the existing Pickup Pact after customer acceptance
      parameters:
        - $ref: "#/components/parameters/CommitmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickupAt]
              properties:
                pickupAt: {type: string, format: date-time}
      responses:
        "200": {description: Pickup slot and Pact version updated}
        "400": {description: Invalid pickup time}
        "404": {description: Commitment not found}
        "409": {description: Invalid commitment or Pact state}

  /api/v1/commitments/{id}/breach-pact:
    post:
      summary: Record a Pickup Pact breach; outbox relay derives the idempotent reward posting
      parameters:
        - $ref: "#/components/parameters/CommitmentId"
      responses:
        "200": {description: Pact breach persisted and compensation scheduled}
        "404": {description: Commitment not found}
        "409": {description: No active Pact or compensation already granted}

  /api/v1/commitments/{id}/claim-pickup:
    post:
      summary: Mark a confirmed pickup as claimed after the customer-facing handoff adapter verifies its one-time code
      parameters:
        - $ref: "#/components/parameters/CommitmentId"
      responses:
        "200": {description: Pickup claimed and leased capacity released}
        "404": {description: Commitment not found}
        "409": {description: Invalid or already-terminal commitment state}

  /api/v1/commitments/{id}/cancel:
    post:
      summary: Cancel a commitment and release leased capacity
      parameters:
        - $ref: "#/components/parameters/CommitmentId"
      responses:
        "200": {description: Cancelled commitment}
        "404": {description: Commitment not found}
        "409": {description: Invalid commitment state}

  /api/v1/ledger/postings:
    post:
      summary: Append one idempotent balanced financial posting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LedgerPostingRequest"
      responses:
        "202":
          description: New balanced posting appended
        "200":
          description: Exact redelivery recognized as a no-op
        "409":
          description: Same event ID reused with conflicting financial meaning

  /api/v1/ledger/orders/{aggregateId}:
    get:
      summary: Read append-only financial posting history for one order
      parameters:
        - in: path
          name: aggregateId
          required: true
          schema: {type: string, minLength: 1}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200": {description: Ledger batch history}

  /api/v1/ledger/conflicts:
    get:
      summary: Read quarantined reused-event-ID conflicts
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200": {description: Quarantined conflict evidence}

  /api/v1/reconcile:
    post:
      summary: Reconstruct canonical event-time state and propose deterministic repairs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconcileRequest"
      responses:
        "200": {description: Reconciliation result}
        "422": {description: Invalid or multi-aggregate evidence packet}

  /api/v1/projections/rebuild:
    post:
      summary: Explicitly rebuild the CQRS commitment projection from canonical event time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconcileRequest"
      responses:
        "200": {description: Rebuilt projection}

  /api/v1/projections/{aggregateId}:
    get:
      summary: Read the current rebuilt CQRS projection
      parameters:
        - in: path
          name: aggregateId
          required: true
          schema: {type: string, minLength: 1}
      responses:
        "200": {description: Current projection}
        "404": {description: Projection not found}

components:
  parameters:
    CommitmentId:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}

  schemas:
    PickupItem:
      type: object
      required: [sku, quantity]
      properties:
        sku: {type: string, minLength: 1}
        quantity: {type: integer, minimum: 1, maximum: 20}

    PickupQuote:
      type: object
      required: [quoteToken, storeId, units, expiresAt, slots]
      properties:
        quoteToken: {type: string}
        storeId: {type: string}
        units: {type: integer, minimum: 1}
        expiresAt: {type: string, format: date-time}
        slots:
          type: array
          items: {$ref: "#/components/schemas/PickupSlotOption"}

    PickupSlotOption:
      type: object
      required: [pickupAt, capacityUnits, reservedUnits, availableUnits, requestedUnits, canFit]
      properties:
        pickupAt: {type: string, format: date-time}
        capacityUnits: {type: integer, minimum: 0}
        reservedUnits: {type: integer, minimum: 0}
        availableUnits: {type: integer, minimum: 0}
        requestedUnits: {type: integer, minimum: 1}
        canFit: {type: boolean}

    LedgerPostingRequest:
      type: object
      required: [eventId, aggregateId, type, amount]
      properties:
        eventId: {type: string, minLength: 1}
        aggregateId: {type: string, minLength: 1}
        type:
          type: string
          enum: [SETTLEMENT, REVERSE_SETTLEMENT, REWARD, REVERSE_REWARD]
        amount:
          type: number
          exclusiveMinimum: 0

    EventEnvelope:
      type: object
      required: [event_id, aggregate_id, event_type, occurred_at, received_at, payload]
      properties:
        event_id: {type: string, minLength: 1}
        aggregate_id: {type: string, minLength: 1}
        event_type:
          type: string
          enum:
            - PickupSlotHeld
            - PaymentAuthorized
            - CommitmentConfirmed
            - CommitmentCancelled
            - SettlementPosted
            - RewardGranted
            - CapacityRevised
            - PickupRescheduled
            - PickupPactIssued
            - PickupPactRenegotiated
            - PickupPactBreached
            - PickupClaimed
            - SettlementReversed
            - RewardReversed
        occurred_at: {type: string, format: date-time}
        received_at: {type: string, format: date-time}
        correlation_id: {type: [string, "null"]}
        causation_id: {type: [string, "null"]}
        schema_version: {type: integer, minimum: 1, default: 1}
        payload: {type: object, additionalProperties: true}

    ReconcileRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/EventEnvelope"
