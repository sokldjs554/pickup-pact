apiVersion: apps/v1
kind: Deployment
metadata:
  name: reconciler
  namespace: pickup-pact
spec:
  replicas: 2
  selector:
    matchLabels: {app: reconciler}
  template:
    metadata:
      labels: {app: reconciler}
    spec:
      containers:
        - name: reconciler
          image: ghcr.io/sokldjs554/pickup-pact-reconciler:latest
          ports: [{containerPort: 8000}]
          env:
            - {name: DD_SERVICE, value: pickup-pact-reconciler}
            - {name: ELASTIC_APM_SERVICE_NAME, value: pickup-pact-reconciler}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "1000m", memory: "512Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: reconciler
  namespace: pickup-pact
spec:
  selector: {app: reconciler}
  ports: [{port: 8000, targetPort: 8000}]
