apiVersion: v1
kind: ConfigMap
metadata:
  name: pickup-pact-config
  namespace: pickup-pact
data:
  SPRING_PROFILES_ACTIVE: postgres,redis,kafka
  KAFKA_BOOTSTRAP_SERVERS: kafka.bootstrap.example:9092
  POSTGRES_R2DBC_URL: r2dbc:postgresql://postgres.example:5432/pickuppact
  POSTGRES_JDBC_URL: jdbc:postgresql://postgres.example:5432/pickuppact
  REDIS_HOST: redis.example
  REDIS_URL: redis://redis.example:6379/0
  MONGODB_URL: mongodb://mongo.example:27017/pickup_pact
  ELASTICSEARCH_URL: https://elasticsearch.example
  PERSIST_RECONCILIATION: "true"
  DD_ENV: staging
  DD_VERSION: 0.1.0
  ELASTIC_APM_SERVER_URL: http://apm-server.observability.svc:8200
