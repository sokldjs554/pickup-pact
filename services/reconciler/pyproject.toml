[project]
name = "pickup-pact-reconciler"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.10,<3",
  "celery[redis]>=5.4,<6",
  "redis>=5,<7",
  "pymongo>=4.10,<5",
  "elasticsearch>=8.15,<10",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "ddtrace>=3,<4",
  "elastic-apm>=6.24,<7"
]

[project.optional-dependencies]
ai = ["anthropic>=0.60", "openai>=1.100", "google-genai>=1.30"]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
