[project]
name = "pickup-pact-reconciler"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "celery[redis]>=5.4,<6",
  "redis>=5,<6",
  "asyncpg>=0.30,<1",
  "motor>=3.6,<4",
  "elasticsearch[async]>=8.17,<9"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
