spring:
  application:
    name: pickup-pact-commitment
  r2dbc:
    url: ${POSTGRES_R2DBC_URL:r2dbc:postgresql://localhost:5432/pickuppact}
    username: ${POSTGRES_USER:pickuppact}
    password: ${POSTGRES_PASSWORD:pickuppact}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

pickup:
  capacity:
    default-units: ${PICKUP_SLOT_CAPACITY:40}
  quote-secret: ${PICKUP_QUOTE_SECRET:local-dev-quote-secret-change-me}

server:
  port: ${PORT:8080}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
