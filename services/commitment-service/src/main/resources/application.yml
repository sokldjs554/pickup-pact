spring:
  application:
    name: pickup-pact-commitment
  r2dbc:
    url: ${POSTGRES_R2DBC_URL:r2dbc:postgresql://localhost:5432/pickuppact}
    username: ${POSTGRES_USER:pickuppact}
    password: ${POSTGRES_PASSWORD:pickuppact}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
