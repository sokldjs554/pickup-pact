services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pickuppact}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pickuppact}
      POSTGRES_DB: ${POSTGRES_DB:-pickuppact}
    ports: ["5432:5432"]
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pickuppact}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  mongo:
    image: mongo:7
    ports: ["27017:27017"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports: ["9092:9092"]

  commitment:
    build: ./services/commitment-service
    environment:
      SPRING_PROFILES_ACTIVE: postgres,redis,kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_HOST: redis
      POSTGRES_R2DBC_URL: r2dbc:postgresql://postgres:5432/pickuppact
      POSTGRES_USER: ${POSTGRES_USER:-pickuppact}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pickuppact}
    ports: ["8080:8080"]
    depends_on:
      - postgres
      - redis
      - kafka

  merchant-fulfillment:
    build: ./services/merchant-fulfillment-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/pickuppact
      POSTGRES_USER: ${POSTGRES_USER:-pickuppact}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pickuppact}
    ports: ["8082:8082"]
    depends_on:
      - postgres
      - kafka

  ledger:
    build: ./services/ledger-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/pickuppact
      POSTGRES_USER: ${POSTGRES_USER:-pickuppact}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pickuppact}
    ports: ["8081:8081"]
    depends_on:
      - postgres
      - kafka

  reconciler:
    build: ./services/reconciler
    environment:
      PERSIST_RECONCILIATION: "true"
      POSTGRES_DSN: postgresql://pickuppact:pickuppact@postgres:5432/pickuppact
      MONGODB_URL: mongodb://mongo:27017/pickup_pact
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      - postgres
      - mongo
      - elasticsearch
      - redis

  replay-worker:
    build: ./services/reconciler
    command: celery -A app.tasks.celery_app worker --loglevel=INFO
    environment:
      REDIS_URL: redis://redis:6379/0
      PERSIST_RECONCILIATION: "true"
      POSTGRES_DSN: postgresql://pickuppact:pickuppact@postgres:5432/pickuppact
      MONGODB_URL: mongodb://mongo:27017/pickup_pact
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      - postgres
      - mongo
      - elasticsearch
      - redis

  ops-console:
    build: ./services/ops-console
    environment:
      RECONCILER_URL: http://reconciler:8000
      BENCHMARK_PATH: /artifacts/consistency-benchmark.json
    volumes:
      - ./artifacts:/artifacts:ro
    ports: ["5000:5000"]
    depends_on:
      - reconciler
