services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pickuppact}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pickuppact}
      POSTGRES_DB: ${POSTGRES_DB:-pickuppact}
    ports: ["5432:5432"]
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pickuppact}"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
  kafka:
    image: bitnami/kafka:3.8
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["9092:9092"]
  commitment:
    build: ./services/commitment-service
    environment:
      SPRING_PROFILES_ACTIVE: postgres,redis,kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      POSTGRES_R2DBC_URL: r2dbc:postgresql://postgres:5432/pickuppact
      POSTGRES_USER: ${POSTGRES_USER:-pickuppact}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pickuppact}
    ports: ["8080:8080"]
    depends_on: [postgres, redis, kafka]
  ledger:
    build: ./services/ledger-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/pickuppact
      POSTGRES_USER: ${POSTGRES_USER:-pickuppact}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pickuppact}
    ports: ["8081:8081"]
    depends_on: [postgres, kafka]
  reconciler:
    build: ./services/reconciler
    environment:
      POSTGRES_DSN: postgresql://pickuppact:pickuppact@postgres:5432/pickuppact
      MONGO_URL: mongodb://mongo:27017
      ELASTICSEARCH_URL: http://elasticsearch:9200
      CELERY_BROKER_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: [postgres, mongo, elasticsearch, redis]
  replay-worker:
    build: ./services/reconciler
    command: celery -A app.tasks.celery_app worker --loglevel=INFO
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on: [redis]
