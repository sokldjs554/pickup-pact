name: release-gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeat-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python verification dependencies
        run: |
          python -m pip install -e './services/reconciler[dev]'
          python -m pip install -r services/ops-console/requirements.txt
          python -m pip install -r demo/requirements.txt
          python -m pip install pyyaml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verification pass 1 — code, tests, contracts
        run: |
          set -euo pipefail
          python scripts/verify_repo.py
          python -m pytest -q services/reconciler/tests
          python -m pytest -q services/ops-console/tests
          python -m pytest -q demo/test_demo.py
          mvn -B -DskipTests=false test
          python - <<'PY'
          from pathlib import Path
          import json
          import yaml
          for path in Path('.').rglob('*.json'):
              if '.git' not in path.parts:
                  json.loads(path.read_text())
          targets = [
              Path('contracts/openapi.yaml'),
              Path('contracts/asyncapi.yaml'),
              Path('docker-compose.yml'),
              Path('render.yaml'),
          ]
          targets += list(Path('infra/k8s').glob('*.yaml'))
          for path in targets:
              list(yaml.safe_load_all(path.read_text()))
          print('pass-1 contract/config parse passed')
          PY

      - name: Verification pass 1 — reproduce evidence
        run: |
          set -euo pipefail
          python scripts/consistency_benchmark.py --orders 20000 --seed 42 --output /tmp/pass1-benchmark.json
          python scripts/consistency_matrix.py --orders 20000 --seeds 11,22,33,44,55 --output /tmp/pass1-matrix.json
          python scripts/verify_evidence.py             --benchmark-actual /tmp/pass1-benchmark.json             --matrix-actual /tmp/pass1-matrix.json

      - name: Verification pass 2 — repeat tests from clean process
        env:
          PYTHONHASHSEED: "123"
        run: |
          set -euo pipefail
          python scripts/verify_repo.py
          python -m pytest -q services/reconciler/tests
          python -m pytest -q services/ops-console/tests
          python -m pytest -q demo/test_demo.py
          mvn -B -DskipTests=false test
          python scripts/consistency_benchmark.py --orders 20000 --seed 42 --output /tmp/pass2-benchmark.json
          python scripts/consistency_matrix.py --orders 20000 --seeds 11,22,33,44,55 --output /tmp/pass2-matrix.json
          python scripts/verify_evidence.py             --benchmark-actual /tmp/pass2-benchmark.json             --matrix-actual /tmp/pass2-matrix.json

      - name: Verification pass 3 — regression repeat
        env:
          PYTHONHASHSEED: "777"
        run: |
          set -euo pipefail
          python -m pytest -q services/reconciler/tests demo/test_demo.py services/ops-console/tests
          mvn -B -DskipTests=false test
          cmp <(python -c 'import json; d=json.load(open("/tmp/pass1-benchmark.json")); d["metrics"].pop("elapsed_ms",None); print(json.dumps(d,sort_keys=True))')               <(python -c 'import json; d=json.load(open("/tmp/pass2-benchmark.json")); d["metrics"].pop("elapsed_ms",None); print(json.dumps(d,sort_keys=True))')
          cmp <(python -c 'import json; print(json.dumps(json.load(open("/tmp/pass1-matrix.json")),sort_keys=True))')               <(python -c 'import json; print(json.dumps(json.load(open("/tmp/pass2-matrix.json")),sort_keys=True))')

      - name: Build and validate deployable artifacts
        run: |
          set -euo pipefail
          docker compose config >/dev/null
          docker compose build commitment ledger reconciler ops-console
          docker build -f Dockerfile.demo -t pickup-pact-demo:release-gate .

      - name: Full Docker topology runtime smoke — two passes
        run: |
          set -euo pipefail
          docker compose up -d --build
          python scripts/integration_smoke.py --passes 2
          docker compose ps

      - name: Capture PostgreSQL execution plan evidence
        run: |
          set -euo pipefail
          docker compose exec -T postgres psql -U pickuppact -d pickuppact -v ON_ERROR_STOP=1 <<'SQL'
          insert into outbox_events(id, aggregate_id, event_type, payload, occurred_at, published_at)
          select
            (
              substr(md5(gs::text || '-id'),1,8) || '-' ||
              substr(md5(gs::text || '-id'),9,4) || '-' ||
              substr(md5(gs::text || '-id'),13,4) || '-' ||
              substr(md5(gs::text || '-id'),17,4) || '-' ||
              substr(md5(gs::text || '-id'),21,12)
            )::uuid,
            case when gs <= 100
              then '00000000-0000-0000-0000-000000001001'::uuid
              else (
                substr(md5(gs::text || '-agg'),1,8) || '-' ||
                substr(md5(gs::text || '-agg'),9,4) || '-' ||
                substr(md5(gs::text || '-agg'),13,4) || '-' ||
                substr(md5(gs::text || '-agg'),17,4) || '-' ||
                substr(md5(gs::text || '-agg'),21,12)
              )::uuid
            end,
            'CommitmentConfirmed',
            '{"source":"release-gate"}'::jsonb,
            now() - (gs || ' seconds')::interval,
            now()
          from generate_series(1, 10100) as gs
          on conflict (id) do nothing;
          analyze outbox_events;
          SQL
          cat sql/explain/commitment_timeline.sql |             docker compose exec -T postgres psql -XAt -U pickuppact -d pickuppact             > /tmp/commitment-timeline-explain.json
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('/tmp/commitment-timeline-explain.json').read_text())
          text = json.dumps(plan)
          assert 'idx_outbox_aggregate_timeline' in text, text
          root = plan[0]['Plan']
          print('execution plan:', root['Node Type'], 'rows=', root.get('Actual Rows'))
          print('verified index: idx_outbox_aggregate_timeline')
          PY

      - name: Dump Docker logs on runtime failure
        if: failure()
        run: docker compose logs --no-color --tail=300 || true

      - name: Stop full Docker topology
        if: always()
        run: docker compose down -v --remove-orphans || true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"

      - name: Terraform validation
        run: |
          set -euo pipefail
          terraform -chdir=infra/aws/terraform fmt -check
          terraform -chdir=infra/aws/terraform init -backend=false
          terraform -chdir=infra/aws/terraform validate

      - name: Upload repeated evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-evidence
          path: |
            /tmp/pass1-benchmark.json
            /tmp/pass1-matrix.json
            /tmp/pass2-benchmark.json
            /tmp/pass2-matrix.json
            /tmp/commitment-timeline-explain.json
          retention-days: 14
