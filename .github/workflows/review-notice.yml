name: review-notice
on:
  push:
    branches: [fix/scoped-recovery-notice]
    paths: ['.review-notice.b64','.review-notice.py','.github/workflows/review-notice.yml']
permissions:
  contents: write
jobs:
  import-reviewed-notice-fix:
    if: contains(github.event.head_commit.message, '[apply-notice-fix]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scoped-recovery-notice
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .review-notice.py
      - name: Commit the five verified content files on this review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: scope pending notices to the recovered operation'
          git push origin HEAD:fix/scoped-recovery-notice
