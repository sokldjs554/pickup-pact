name: ha-real-hosts
# 승인된 Oracle 시험 서버(infra/ha/hosts/oracle-osaka.json)에만 SSH로 접속한다.
# 수동 실행 전용. 개인키는 저장소 Secret PACT_HA_SSH_KEY에서만 읽는다.
on:
  push:
    # push로는 읽기 전용 preflight만 실행된다. 설치·시험 단계는 수동 실행(workflow_dispatch) 전용.
    branches: [feat/ha-dr-foundation-20261002]
    paths: ['.github/workflows/ha-real-hosts.yml', 'infra/ha/hosts/**', 'scripts/ha_real_*.py']
  workflow_dispatch:
    inputs:
      phase:
        description: '실행 단계'
        type: choice
        options: [preflight, install, deploy, diagnose, verify-basic, verify-faults]
        default: preflight
permissions:
  contents: read
concurrency:
  group: ha-real-hosts
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the phase
        id: phase
        run: |
          set -euo pipefail
          phase="${{ inputs.phase }}"
          # push로 시작되면 저장소의 phase 파일이 단계를 정한다(허용 목록만).
          [ -n "$phase" ] || phase="$(tr -d '[:space:]' < infra/ha/hosts/phase)"
          case "$phase" in preflight|install|deploy|diagnose|verify-basic|verify-faults) ;; *) echo "허용되지 않은 단계: $phase"; exit 1;; esac
          echo "name=$phase" >> "$GITHUB_OUTPUT"
      - name: Prepare the SSH key
        env:
          PACT_HA_SSH_KEY: ${{ secrets.PACT_HA_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$PACT_HA_SSH_KEY" || { echo "PACT_HA_SSH_KEY secret이 비어 있다"; exit 1; }
          umask 077
          printf '%s\n' "$PACT_HA_SSH_KEY" > "$RUNNER_TEMP/pact-ha-key"
          echo "PACT_HA_SSH_KEY_FILE=$RUNNER_TEMP/pact-ha-key" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runner dependencies
        run: python -m pip install -q -r requirements-ha.txt
      - name: Run the phase
        env:
          PYTHONPATH: .:services/reconciler
        run: python scripts/ha_real_hosts.py "${{ steps.phase.outputs.name }}" --output verification/ha-real-hosts/${{ steps.phase.outputs.name }}
      - name: Remove the SSH key
        if: always()
        run: shred -u "$RUNNER_TEMP/pact-ha-key" || rm -f "$RUNNER_TEMP/pact-ha-key"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ha-real-hosts-${{ steps.phase.outputs.name }}
          path: verification/ha-real-hosts
          retention-days: 30
