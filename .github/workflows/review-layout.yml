name: review-layout
on:
  push:
    branches: [feat/decision-grade-review]
    paths: ['.review-layout.json', '.github/workflows/review-layout.yml']
permissions:
  contents: write
jobs:
  apply-reviewed-consent-layout:
    if: contains(github.event.head_commit.message, '[apply-consent-layout]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/decision-grade-review
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate every preimage and resulting source before writing
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          rows=json.loads(Path('.review-layout.json').read_text())
          allowed={'demo/route/handoff.css','demo/route/index.html','demo/route/product.js','scripts/verify_decision_browser.py','tests/route/test_decision_presentation.py'}
          assert len(rows)==5 and {r['path'] for r in rows}==allowed
          staged=[]
          for row in rows:
              p=Path(row['path']);old=p.read_bytes()
              assert hashlib.sha256(old).hexdigest()==row['before'],str(p)
              value=old.decode('utf-8')
              edits=row['edits'];assert edits==sorted(edits)
              for start,end,replacement in reversed(edits):
                  assert 0<=start<=end<=len(value)
                  value=value[:start]+replacement+value[end:]
              data=value.encode('utf-8')
              assert hashlib.sha256(data).hexdigest()==row['after'],str(p)
              staged.append((p,data))
          for p,data in staged:p.write_bytes(data)
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - name: Publish only reviewed application and test files on this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keep consent title and actions visible while terms scroll'
          git push origin HEAD:feat/decision-grade-review
