name: ha-multi-host-rehearsal
# Rendered ha_postgres_v1 configuration on ONE runner: three Docker "hosts" with
# Patroni, etcd and every service role. Development evidence only; independent-host
# HA and off-host DR need the approved inventory described in docs/ha-multi-host-rollout.md.
on:
  push:
    branches: [feat/ha-dr-foundation-20261002]
  pull_request:
    paths: ['demo/route/**', 'tests/ha/**', 'infra/ha/**', 'scripts/ha_*.py', 'scripts/verify_ha_*.py',
            'requirements-ha.txt', '.github/workflows/ha-multi-host-rehearsal.yml']
permissions:
  contents: read
concurrency:
  group: ha-multi-host-rehearsal-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONPATH: .:services/reconciler
  PICKUP_HA_TEST: '1'
jobs:
  cluster-failover:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and build the rehearsal images
        run: |
          set -euo pipefail
          python -m pip install -r requirements-ha.txt
          mkdir -p verification/ha-cluster build/app-image
          cp requirements-ha.txt requirements-workbench.txt build/app-image/
          docker build -f infra/ha/rehearsal/patroni.Dockerfile -t pickup-patroni-rehearsal:dev infra/ha/rehearsal
          docker build -f infra/ha/rehearsal/app.Dockerfile -t pickup-app-rehearsal:dev build/app-image
          docker pull gcr.io/etcd-development/etcd:v3.5.17
          git rev-parse HEAD > verification/ha-cluster/tested-commit.txt
      - name: Inventory gate and rendered configuration contracts
        run: python -m pytest -q tests/ha/test_inventory.py tests/ha/test_ha_settings.py tests/ha/test_internal_mtls.py tests/ha/test_backup_ops.py
      - name: HA-01..HA-06, WAL archive and generation fence on three fresh clusters
        run: python scripts/verify_ha_cluster.py --repeat 3 --output verification/ha-cluster/failover
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ha-cluster-failover-evidence
          path: |
            verification/ha-cluster
            !verification/ha-cluster/**/config*/**
          retention-days: 30

  cluster-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install dependencies, backup tools, browser and rehearsal images
        run: |
          set -euo pipefail
          python -m pip install -r requirements-ha.txt -r services/ops-console/requirements.txt 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq apache2-utils
          mkdir -p "$RUNNER_TEMP/backup-bin" verification/ha-cluster-restore build/app-image
          GOBIN="$RUNNER_TEMP/backup-bin" go install github.com/restic/restic/cmd/restic@v0.19.1
          GOBIN="$RUNNER_TEMP/backup-bin" go install github.com/restic/rest-server/cmd/rest-server@v0.14.0
          echo "$RUNNER_TEMP/backup-bin" >> "$GITHUB_PATH"
          cp requirements-ha.txt requirements-workbench.txt build/app-image/
          docker build -f infra/ha/rehearsal/patroni.Dockerfile -t pickup-patroni-rehearsal:dev infra/ha/rehearsal
          docker build -f infra/ha/rehearsal/app.Dockerfile -t pickup-app-rehearsal:dev build/app-image
          docker pull gcr.io/etcd-development/etcd:v3.5.17
          git rev-parse HEAD > verification/ha-cluster-restore/tested-commit.txt
          echo "RENDER_GIT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: WAL shipping, alerts and credential split against an append-only HTTPS store
        run: python scripts/verify_ha_backup_ops.py --repeat 3 --output verification/ha-cluster-restore/backup-ops
      - name: Whole-cluster loss, restore from the external store, generation bump, API and browser checks
        run: python scripts/verify_ha_cluster_restore.py --repeat 3 --browsers --output verification/ha-cluster-restore/restore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ha-cluster-restore-evidence
          path: |
            verification/ha-cluster-restore
            !verification/ha-cluster-restore/**/config*/**
          retention-days: 30
