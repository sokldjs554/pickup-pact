name: demo-ci

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "Dockerfile.demo"
      - "render.yaml"
      - "services/reconciler/app/**"
      - "services/reconciler/app/models.py"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "demo/**"
      - "Dockerfile.demo"
      - "render.yaml"
      - "services/reconciler/app/**"
      - "services/reconciler/app/models.py"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  verify-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install demo dependencies
        run: pip install -r demo/requirements.txt

      - name: Run interviewer demo tests
        run: pytest -q demo/test_demo.py demo/test_repair_integration.py

      - name: Build public demo image
        run: docker build -f Dockerfile.demo -t pickup-pact-demo:ci .
