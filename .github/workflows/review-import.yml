name: review-import
on:
  push:
    branches: [feat/decision-grade-review]
    paths: ['.review-transfer/**', '.github/workflows/review-import.yml']
permissions:
  contents: write
jobs:
  import-reviewed-content:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/decision-grade-review
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate original and revised bytes before applying content
        run: python .review-transfer/apply.py
      - name: Commit only reviewed project content to this review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: qualify transfers and compare a protected reorder baseline'
          git push origin HEAD:feat/decision-grade-review
