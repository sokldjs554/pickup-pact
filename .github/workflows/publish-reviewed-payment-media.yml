name: publish-reviewed-payment-media
on:
  push:
    branches: [feat/merchant-payment-20260930]
    paths: ['.media-review/**', '.github/workflows/publish-reviewed-payment-media.yml']
permissions:
  contents: write
  actions: read
jobs:
  reviewed-artifact-only:
    if: github.ref == 'refs/heads/feat/merchant-payment-20260930'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/merchant-payment-20260930
          fetch-depth: 0
      - name: Validate original source and fixed reviewed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = feat/merchant-payment-20260930
          git diff --exit-code 36db020cb57c2d1d2994fc1dc9890761e95f0200 HEAD -- demo services contracts scripts tests
          curl --fail --silent --show-error --location --max-time 90 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/sokldjs554/pickup-pact/actions/artifacts/11094890834/zip -o "$RUNNER_TEMP/payment-media.zip"
          echo "2bc1c7aecb4893dcb7c97827cc6f2aa13b34ade5217fced82186ec0821a65e16  $RUNNER_TEMP/payment-media.zip" | sha256sum --check
          python - "$RUNNER_TEMP" <<'PY'
          import sys,zipfile
          from pathlib import Path
          root=Path(sys.argv[1])/'reviewed-payment'
          with zipfile.ZipFile(Path(sys.argv[1])/'payment-media.zip') as archive:
              assert archive.testzip() is None
              for info in archive.infolist():
                  assert (root/info.filename).resolve().is_relative_to(root.resolve())
                  assert info.file_size<100_000_000
              archive.extractall(root)
          PY
          python .media-review/publish.py "$RUNNER_TEMP/reviewed-payment"
      - name: Publish only reviewed documents and media on feature branch
        run: |
          set -euo pipefail
          python scripts/verify_repo.py
          git add README.md docs/media/payment docs/payment-release-verification-2026-09-30.md docs/payment-implementation-status-2026-09-30.md
          git diff --cached --check
          python - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          allowed={'README.md','docs/payment-release-verification-2026-09-30.md','docs/payment-implementation-status-2026-09-30.md'}
          assert paths and all(p in allowed or p.startswith('docs/media/payment/') for p in paths),paths
          PY
          git -c user.name=github-actions\[bot\] -c user.email=41898282+github-actions\[bot\]@users.noreply.github.com commit -m 'docs: 독립 결제 42초 실행 영상과 가맹점·원본 대조 근거'
          git push origin HEAD:refs/heads/feat/merchant-payment-20260930
