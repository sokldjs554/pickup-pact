name: assemble-recovery
on:
  push:
    branches: [feat/recovery-release-audit]
permissions:
  contents: write
jobs:
  apply-reviewed-source:
    if: contains(github.event.head_commit.message, '[assemble-recovery]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/recovery-release-audit
      - name: Apply checksum-bound reviewed text changes only
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          root=Path.cwd().resolve()
          transport=root/'.recovery-transport'
          compressed=base64.b64decode(''.join((transport/f'part-{i}.txt').read_text() for i in range(7)),validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='7534143af243472200628762bd1542685dc3bfe5e4b50edc1bcbdcc99059fd0f'
          raw=lzma.decompress(compressed)
          assert hashlib.sha256(raw).hexdigest()=='b33949ba06ccaef34ad9eecbc3118cd9d8da541675940e317be707d1aa73415e'
          entries=json.loads(raw)
          assert len(entries)==33
          seen=set(); verified=[]
          for entry in entries:
              relative=Path(entry['path'])
              assert not relative.is_absolute() and '..' not in relative.parts
              assert relative.parts[0] not in ('.git','.github','.recovery-transport')
              assert str(relative) not in seen
              seen.add(str(relative))
              path=root/relative
              assert path.resolve().is_relative_to(root)
              old=path.read_bytes() if path.exists() else b''
              if entry['old_sha256'] is None:
                  assert not path.exists(), str(relative)
              else:
                  assert hashlib.sha256(old).hexdigest()==entry['old_sha256'], str(relative)
              text=old.decode('utf-8'); last=len(text)
              for start,end,replacement in reversed(entry['ops']):
                  assert 0<=start<=end<=last
                  text=text[:start]+replacement+text[end:]
                  last=start
              data=text.encode('utf-8')
              assert hashlib.sha256(data).hexdigest()==entry['new_sha256'], str(relative)
              verified.append((path,data))
          for path,data in verified:
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
          for path in transport.glob('part-*.txt'): path.unlink()
          transport.rmdir()
          print('Verified and applied',len(verified),'reviewed files; no workflow edits through content token')
          PY
          git diff --check
      - name: Commit source to review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md demo scripts tests docs contracts .recovery-transport
          git commit -m 'feat: restore reviewed transfer recovery, supervised HTTP merchants and whole-flow tests'
          git push origin HEAD:feat/recovery-release-audit
