name: review-boot
on:
  push:
    branches: [fix/deferred-route-bootstrap]
    paths: ['.review-boot.b64','.review-boot.py','.github/workflows/review-boot.yml']
permissions:
  contents: write
jobs:
  import-reviewed-bootstrap-fix:
    if: contains(github.event.head_commit.message, '[apply-bootstrap-fix]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deferred-route-bootstrap
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .review-boot.py
      - name: Commit the five verified content files on this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: restore saved orders after all deferred render listeners are ready'
          git push origin HEAD:fix/deferred-route-bootstrap
