name: route-product
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer-outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .:services/reconciler
      ROUTE_DB: /tmp/pickup-pact-route-ci.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-workbench.txt -r services/ops-console/requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Repeat all Python boundaries
        run: |
          set -euo pipefail
          mkdir -p verification/route-product
          for pass in 1 2 3; do
            python -m pytest -q tests/route services/reconciler/tests demo/test_demo.py demo/test_repair_integration.py services/ops-console/tests | tee verification/route-product/tests-$pass.log
          done
      - name: Reproduce paired outcomes with all failures included
        run: |
          set -euo pipefail
          for pass in 1 2 3; do
            python scripts/route_outcomes.py --output verification/route-product/outcomes-$pass
          done
          python - <<'PY2'
          import json
          from pathlib import Path
          for seed in (7,19,31):
              reports=[json.loads(Path(f'verification/route-product/outcomes-{p}/seed-{seed}.json').read_text()) for p in (1,2,3)]
              assert reports[0]==reports[1]==reports[2]
              assert len(reports[0]['cases'])==120
          PY2
      - name: Start real product HTTP server
        run: |
          uvicorn demo.main:app --host 127.0.0.1 --port 10000 > verification/route-product/server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:10000/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Customer rescue and receipt desktop/mobile three times
        run: python scripts/verify_route_browser.py --repeat 3 --output verification/route-product/browser
      - name: Coupon loss, restoration and one-time point settlement in real browsers
        run: python scripts/verify_benefits_browser.py --repeat 3 --output verification/route-product/benefits-browser
      - name: Preserve exact source
        if: always()
        run: |
          git rev-parse HEAD > verification/route-product/tested-commit.txt
          git archive --format=zip --output=verification/route-product/tested-source.zip HEAD
          sha256sum verification/route-product/tested-source.zip > verification/route-product/tested-source.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-product-evidence
          path: verification/route-product
      - name: Wait for matching public release
        if: github.ref == 'refs/heads/main'
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          for i in range(80):
              try:
                  with urllib.request.urlopen('https://pickup-pact-demo.onrender.com/health', timeout=10) as r:
                      if json.load(r).get('release_commit') == os.environ['EXPECTED_COMMIT']: break
              except Exception: pass
              time.sleep(8)
          else: raise SystemExit('matching deployment not observed')
          PY
      - name: Same-commit public customer product
        if: github.ref == 'refs/heads/main'
        run: >-
          python scripts/verify_route_browser.py --repeat 3
          --base-url https://pickup-pact-demo.onrender.com
          --expected-commit '${{ github.sha }}'
          --output verification/route-live
      - name: Same-commit public coupon, point and evidence flows
        if: github.ref == 'refs/heads/main'
        run: >-
          python scripts/verify_benefits_browser.py --repeat 3
          --base-url https://pickup-pact-demo.onrender.com
          --expected-commit '${{ github.sha }}'
          --output verification/route-live/benefits-browser
      - uses: actions/upload-artifact@v4
        if: always() && github.ref == 'refs/heads/main'
        with:
          name: route-live-evidence
          path: verification/route-live
