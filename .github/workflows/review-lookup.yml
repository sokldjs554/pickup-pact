name: review-lookup
on:
  push:
    branches: [fix/deferred-route-bootstrap]
    paths: ['.review-lookup.json','.github/workflows/review-lookup.yml']
permissions:
  contents: write
jobs:
  import-reviewed-lookup-fix:
    if: contains(github.event.head_commit.message, '[apply-lookup-fix]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deferred-route-bootstrap
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate three reviewed before and after contents
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          rows=json.loads(Path('.review-lookup.json').read_text())
          allowed={'demo/route/product.js','scripts/verify_bootstrap_order.cjs','docs/bootstrap-review-2026-09-26.md'}
          assert len(rows)==3 and {r['path'] for r in rows}==allowed
          ready=[]
          for r in rows:
              p=Path(r['path']);assert not p.is_symlink()
              old=p.read_bytes();assert hashlib.sha256(old).hexdigest()==r['before']
              text=old.decode('utf-8');assert r['edits']==sorted(r['edits'])
              for a,b,value in reversed(r['edits']):
                  assert 0<=a<=b<=len(text);text=text[:a]+value+text[b:]
              data=text.encode();assert hashlib.sha256(data).hexdigest()==r['after']
              ready.append((p,data))
          for p,data in ready:p.write_bytes(data)
          subprocess.run(['node','scripts/verify_bootstrap_order.cjs'],check=True)
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - name: Commit reviewed content on the same review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keep saved order reference when its lookup fails'
          git push origin HEAD:fix/deferred-route-bootstrap
