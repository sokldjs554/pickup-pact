name: consistency-closure
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-fences:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pickuppact
          POSTGRES_PASSWORD: pickuppact
          POSTGRES_DB: closure
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PYTHONPATH: .:services/reconciler
      POSTGRES_DSN: postgresql://pickuppact:pickuppact@127.0.0.1:5432/closure
      PERSIST_RECONCILIATION: 'false'
      AI_PROVIDER: offline
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-workbench.txt 'psycopg[binary]>=3.2,<4'
      - name: PostgreSQL boundary regressions
        run: |
          set -euo pipefail
          mkdir -p /tmp/closure
          for pass in 1 2 3; do
            python -m pytest -q tests/postgres | tee /tmp/closure/postgres-$pass.log
          done
      - name: Preserve tested source
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          mkdir -p /tmp/closure
          git rev-parse HEAD > /tmp/closure/tested-commit.txt
          git archive --format=zip -o /tmp/closure/tested-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consistency-closure-evidence
          path: /tmp/closure/
