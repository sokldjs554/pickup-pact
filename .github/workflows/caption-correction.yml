name: caption-correction
on:
  push:
    branches: [fix/demo-caption-price-reason]
permissions:
  contents: write
jobs:
  correct-reviewed-recording:
    if: contains(github.event.head_commit.message, '[render-caption]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/demo-caption-price-reason
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install caption renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Correct only the caption in the existing reviewed recording
        run: python scripts/correct_demo_caption.py
      - name: Apply verified media and consistent source text
        run: |
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          old='11분 빠른 도착 예상 / 쿠폰 상실로 1,400원 추가'
          new='매장 변경: 메뉴 차액 400원 + 전용 쿠폰 미적용 1,000원 = 1,400원 추가'
          p=Path('scripts/capture_readme_demo.py'); text=p.read_text(); assert text.count(old)==1
          p.write_text(text.replace(old,new))
          old='쿠폰 할인이 사라져 1,400원 추가되는지 확인'
          new='매장 변경 전 메뉴 차액 400원과 전용 쿠폰 미적용 1,000원을 확인'
          for name in ('README.md','.github/workflows/demo-media.yml'):
              p=Path(name); text=p.read_text(); assert text.count(old)==1, name
              p.write_text(text.replace(old,new))
          source=Path('verification/corrected-caption'); target=Path('docs/media')
          report=json.loads((source/'capture.json').read_text())
          assert report['same_order'] and report['cash_due']==3700 and report['capture_count']==1
          assert report['points_spent']==1000 and report['points_earned']==37
          assert report['caption_correction']['new_browser_recording'] is False
          assert report['edited_duration_seconds']==38.16
          for name in ('pickup-pact-demo.mp4','pickup-pact-preview.gif'):
              assert hashlib.sha256((source/name).read_bytes()).hexdigest()==report['media_sha256'][name]
          for name in ('pickup-pact-demo.mp4','pickup-pact-preview.gif','capture.json','caption-verification.json'):
              shutil.copy2(source/name,target/name)
          PY
          python -m py_compile scripts/capture_readme_demo.py scripts/correct_demo_caption.py
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corrected-caption-evidence
          path: verification/corrected-caption
      - name: Commit caption correction on the review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/demo-media.yml scripts/capture_readme_demo.py docs/media/pickup-pact-demo.mp4 docs/media/pickup-pact-preview.gif docs/media/capture.json docs/media/caption-verification.json
          git commit -m 'docs: distinguish menu price difference from store-only coupon loss'
          git push origin HEAD:fix/demo-caption-price-reason
