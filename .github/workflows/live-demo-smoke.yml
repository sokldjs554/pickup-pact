name: live-demo-smoke

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "Dockerfile.demo"
      - "render.yaml"
      - "services/reconciler/app/engine.py"
      - "services/reconciler/app/models.py"
      - ".github/workflows/live-demo-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for exact public demo release
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.request

          BASE = "https://pickup-pact-demo.onrender.com"
          EXPECTED_COMMIT = os.environ["EXPECTED_COMMIT"]

          def request(method: str, path: str, payload=None, timeout=20):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  BASE + path,
                  data=data,
                  method=method,
                  headers={"Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          def text(path: str):
              with urllib.request.urlopen(BASE + path, timeout=20) as response:
                  return response.read().decode()

          for attempt in range(1, 43):
              try:
                  health = request("GET", "/health")
                  page = text("/")
                  assert health["status"] == "ok"
                  assert health["engine"] == "services/reconciler/app/engine.py"
                  assert health["release_commit"] == EXPECTED_COMMIT, (
                      health.get("release_commit"),
                      EXPECTED_COMMIT,
                  )
                  for marker in [
                      "오늘 뭐 드실래요?",
                      "근처 매장",
                      "장바구니 보기",
                      "내 주문",
                      "체험 손님",
                      "주문 취소",
                      "주문 내역",
                      "모바일 영수증",
                      "ONE-TIME PICKUP CODE",
                      "TRUST RECEIPT",
                      "수령 완료 체험",
                      "픽업 시간이 바뀌면 먼저 알려드려요.",
                      "괜찮아요",
                      "주문 흐름",
                      "장애 주입",
                      "정합성 복구",
                      "정산 · 감사",
                  ]:
                      assert marker in page

                  catalog = request("GET", "/api/demo/catalog")
                  customer = request("GET", "/api/demo/customer")
                  assert len(catalog) >= 3
                  assert customer["label"] == "체험 손님"
                  assert any(item["name"] == "아메리카노" for item in catalog[0]["menu"])

                  session = request("POST", "/api/demo/sessions", {})
                  sid = session["session_id"]
                  held = request(
                      "POST",
                      f"/api/demo/sessions/{sid}/orders",
                      {
                          "store": "deploy-check",
                          "items": "아메리카노",
                          "total": 4500,
                          "pickup_at": "12:30",
                          "units": 1,
                      },
                  )
                  assert held["state"]["order"]["status"] == "HELD"
                  print(f"exact public demo release {EXPECTED_COMMIT} is ready on attempt {attempt}")
                  break
              except Exception as exc:
                  if attempt == 42:
                      raise
                  print(f"attempt {attempt}: {exc}")
                  time.sleep(10)
          PY

      - name: Verify fixed interviewer scenarios
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import urllib.request

          BASE = "https://pickup-pact-demo.onrender.com"
          expected = {
              "late-cancel": {"REVERSE_SETTLEMENT", "REVERSE_REWARD"},
              "duplicate": {"NO_OP_DUPLICATE", "REBUILD_PROJECTION"},
              "capacity-drop": {"RESLOT_REVIEW"},
              "conflict": {"MANUAL_REVIEW"},
          }

          for scenario, required in expected.items():
              with urllib.request.urlopen(f"{BASE}/api/scenarios/{scenario}", timeout=30) as response:
                  payload = json.loads(response.read())
              actual = {item["code"] for item in payload["repairs"]}
              assert required <= actual, (scenario, required, actual, payload)
              assert payload["anomalies"], (scenario, payload)
              assert payload["evidence_event_ids"], (scenario, payload)
              assert payload["engine"] == "services/reconciler/app/engine.py", payload

          print("fixed interviewer scenarios passed")
          PY

      - name: Verify full live operator flow twice
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import urllib.error
          import urllib.request

          BASE = "https://pickup-pact-demo.onrender.com"

          def request(method: str, path: str, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  BASE + path,
                  data=body,
                  method=method,
                  headers={"Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.loads(response.read())
              except urllib.error.HTTPError as exc:
                  raise AssertionError(
                      f"{method} {path} failed: {exc.code} {exc.read().decode()}"
                  ) from exc

          def one_pass():
              session = request("POST", "/api/demo/sessions", {})
              sid = session["session_id"]

              held = request(
                  "POST",
                  f"/api/demo/sessions/{sid}/orders",
                  {
                      "store": "Live Smoke 강남점",
                      "items": "아메리카노 2잔",
                      "total": 9000,
                      "pickup_at": "12:30",
                      "units": 2,
                  },
              )["state"]
              assert held["order"]["status"] == "HELD"
              assert held["order"]["payment_authorized"] is False

              paid = request(
                  "POST",
                  f"/api/demo/sessions/{sid}/payment",
                  {"authorization_id": "live-auth"},
              )["state"]
              assert paid["order"]["payment_authorized"] is True

              confirmed = request("POST", f"/api/demo/sessions/{sid}/confirm", {})["state"]
              assert confirmed["order"]["status"] == "CONFIRMED"

              cancelled = request(
                  "POST",
                  f"/api/demo/sessions/{sid}/cancel",
                  {"delay_seconds": 52},
              )
              assert cancelled["event"]["received_at"] > cancelled["event"]["occurred_at"]

              request("POST", f"/api/demo/sessions/{sid}/settlement", {"amount": 9000})
              request("POST", f"/api/demo/sessions/{sid}/reward", {"amount": 90})

              reconciled = request("POST", f"/api/demo/sessions/{sid}/reconcile", {})
              repairs = {item["code"] for item in reconciled["reconciliation"]["repairs"]}
              assert {"REVERSE_SETTLEMENT", "REVERSE_REWARD"} <= repairs, reconciled

              repaired = request("POST", f"/api/demo/sessions/{sid}/repairs/apply", {})
              assert {"REVERSE_SETTLEMENT", "REVERSE_REWARD"} <= set(repaired["applied"]), repaired
              assert repaired["state"]["metrics"]["net_settlement"] == 0, repaired
              assert repaired["state"]["metrics"]["reward_balance"] == 0, repaired
              assert any(
                  row["posting_type"] == "REVERSE_SETTLEMENT"
                  for row in repaired["state"]["ledger_batches"]
              )
              assert any(
                  row["posting_type"] == "REVERSE_REWARD"
                  for row in repaired["state"]["ledger_batches"]
              )

              second = request("POST", "/api/demo/sessions", {})
              second_state = request("GET", f"/api/demo/sessions/{second['session_id']}")
              assert second_state["order"] is None
              assert second_state["events"] == []

          one_pass()
          one_pass()
          print("full public operator flow passed twice")
          PY

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Playwright for live browser verification
        working-directory: demo
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Verify customer smart-order and hidden expert flows in the deployed public UI
        working-directory: demo
        env:
          DEMO_BASE_URL: https://pickup-pact-demo.onrender.com
        run: npm run test:e2e

