name: live-demo-smoke

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "Dockerfile.demo"
      - "render.yaml"
      - ".github/workflows/live-demo-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for the expected public demo release
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://pickup-pact-demo.onrender.com"

          for attempt in $(seq 1 36); do
            health_ok=false
            page_ok=false

            if curl --silent --show-error --fail --max-time 15 "$BASE_URL/health" -o /tmp/health.json; then
              if python - <<'PY'
          import json
          payload = json.load(open("/tmp/health.json"))
          raise SystemExit(0 if payload.get("status") == "ok" else 1)
          PY
              then
                health_ok=true
              fi
            fi

            if curl --silent --show-error --fail --max-time 15 "$BASE_URL/" -o /tmp/index.html; then
              if grep -Fq "고객은 주문을 취소했는데" /tmp/index.html                 && grep -Fq "패스오더 직무를 겨냥한 스마트오더 백엔드 장애 복구 데모" /tmp/index.html                 && grep -Fq "장애 감지 및 복구 계획 계산" /tmp/index.html; then
                page_ok=true
              fi
            fi

            if [ "$health_ok" = true ] && [ "$page_ok" = true ]; then
              echo "expected public demo release is ready"
              break
            fi

            if [ "$attempt" -eq 36 ]; then
              echo "expected public demo release did not become ready" >&2
              exit 1
            fi

            sleep 10
          done

      - name: Verify interviewer scenarios
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://pickup-pact-demo.onrender.com"

          for scenario in late-cancel duplicate capacity-drop conflict; do
            curl --silent --show-error --fail --max-time 20               "$BASE_URL/api/scenarios/$scenario"               -o "/tmp/$scenario.json"
          done

          python - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "late-cancel": {"REVERSE_SETTLEMENT", "REVERSE_REWARD"},
              "duplicate": {"NO_OP_DUPLICATE", "REBUILD_PROJECTION"},
              "capacity-drop": {"RESLOT_REVIEW"},
              "conflict": {"MANUAL_REVIEW"},
          }

          for scenario, commands in expected.items():
              payload = json.loads(Path(f"/tmp/{scenario}.json").read_text())
              actual = {item["code"] for item in payload["repairs"]}
              missing = commands - actual
              assert not missing, (scenario, missing, payload)
              assert payload["anomalies"], (scenario, payload)
              assert payload["evidence_event_ids"], (scenario, payload)
              assert payload["engine"] == "services/reconciler/app/engine.py", payload

          print("live demo smoke passed for all four scenarios")
          PY

      - name: Verify interviewer landing page
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 20             https://pickup-pact-demo.onrender.com/ -o /tmp/index.html

          grep -F "고객은 주문을 취소했는데" /tmp/index.html
          grep -F "패스오더 직무를 겨냥한 스마트오더 백엔드 장애 복구 데모" /tmp/index.html
          grep -F "장애 감지 및 복구 계획 계산" /tmp/index.html
