name: publish-reviewed-guided-media
on:
  push:
    branches: [feat/guided-demo-20260930]
    paths: [.media-review/publish.py, .github/workflows/publish-reviewed-guided-media.yml]
permissions:
  contents: write
  actions: read
jobs:
  pinned-media-only:
    if: github.ref == 'refs/heads/feat/guided-demo-20260930'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/guided-demo-20260930
          fetch-depth: 0
      - name: Verify already-reviewed artifact before copying
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = feat/guided-demo-20260930
          git diff --exit-code 2fc77ae08247554957343e04f49db798d46867df HEAD -- demo services contracts
          curl --fail --silent --show-error --location --max-time 60 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/sokldjs554/pickup-pact/actions/artifacts/11081832755/zip -o "$RUNNER_TEMP/guided-media.zip"
          echo "6ffe17428a977946e242bf8ca86a14a8eb3c788be18a4b4e5b605e24237ae3a0  $RUNNER_TEMP/guided-media.zip" | sha256sum --check
          python - "$RUNNER_TEMP" <<'PY'
          import sys, zipfile
          from pathlib import Path
          root=Path(sys.argv[1])/'reviewed-media'
          with zipfile.ZipFile(Path(sys.argv[1])/'guided-media.zip') as archive:
              assert archive.testzip() is None
              for info in archive.infolist():
                  target=(root/info.filename).resolve()
                  assert target.is_relative_to(root.resolve())
                  assert info.file_size<100_000_000
              archive.extractall(root)
          PY
          python .media-review/publish.py "$RUNNER_TEMP/reviewed-media"
      - name: Check documentation and commit only reviewed media on feature branch
        run: |
          set -euo pipefail
          python scripts/verify_repo.py
          git add README.md docs/media/guided
          git diff --cached --check
          python - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert paths and all(p=='README.md' or p.startswith('docs/media/guided/') for p in paths),paths
          PY
          git -c user.name=github-actions\[bot\] -c user.email=41898282+github-actions\[bot\]@users.noreply.github.com commit -m 'docs: 검증한 41초 주문 보존 체험 영상과 새 화면'
          git push origin HEAD:refs/heads/feat/guided-demo-20260930
