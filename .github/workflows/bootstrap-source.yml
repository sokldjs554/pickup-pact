name: Bootstrap source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-source.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.part* | base64 -d > /tmp/pickup-pact.zip
          echo "9e79001171b5b0ab878b1bcd1f1cce593a0172ad3f25112c7363e6f0fdaae92d  /tmp/pickup-pact.zip" | sha256sum -c -

      - name: Unpack repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pickup-pact-src
          mkdir -p /tmp/pickup-pact-src
          unzip -q /tmp/pickup-pact.zip -d /tmp/pickup-pact-src
          rsync -a --delete --exclude='.git/' /tmp/pickup-pact-src/ ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Publish source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No source changes to publish."
            exit 0
          fi
          git commit -m "feat: publish Pickup Pact backend and interactive demo"
          git push origin HEAD:main
